name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kern kompilieren und testen
        run: make test
      - name: Ausgabedateien sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ausgabe
          path: out/
