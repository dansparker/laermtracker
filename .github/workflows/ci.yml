name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kern ohne Warnungen uebersetzen
        run: make lint
      - name: Kern kompilieren und testen
        run: make test
      - name: Ausgabedateien pruefen (WAV/SVG/CSV)
        run: python3 tests/check_outputs.py out
      - name: Grenzfalltests
        run: make test-edge
      - name: Ausgabedateien sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ausgabe
          path: out/
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests mit AddressSanitizer + UBSan
        run: |
          make test test-edge CFLAGS="-O1 -g -std=c99 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Abhaengigkeiten holen (HAL, CMSIS, FatFs)
        run: sh fw/fetch_deps.sh
      - name: Firmware bauen (linker und rechter I2S-Slot)
        run: |
          make -C fw
          make -C fw MIC_CHANNEL=1 BUILD=build_r
          mkdir -p dist
          cp fw/build/laermtracker.bin dist/laermtracker.bin
          cp fw/build_r/laermtracker.bin dist/laermtracker_rechts.bin
          cp fw/build/laermtracker.elf fw/build/laermtracker.map dist/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
  pc-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ALSA-Entwicklungsdateien
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - name: PC-Version bauen (mit ALSA-Mikrofon)
        run: gcc -std=gnu99 -O2 -Wall -Wextra -DHAVE_ALSA -o laermtracker pc/laermtracker.c core/noise_core.c -lasound -lm
      - name: Testaufnahme erzeugen und analysieren
        run: |
          python3 tests/make_test_wav.py test_in.wav
          ./laermtracker --wav-in test_in.wav --start "2026-10-03 21:59:30" --out out_pc
          python3 tests/check_pc.py out_pc
          ./laermtracker --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: laermtracker-linux-x86_64
          path: laermtracker
  pc-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PC-Version bauen (MinGW, statisch)
        shell: bash
        run: gcc -std=gnu99 -O2 -Wall -Wextra -static -o laermtracker.exe pc/laermtracker.c core/noise_core.c -lwinmm -lm
      - name: Testaufnahme erzeugen und analysieren
        shell: bash
        run: |
          python tests/make_test_wav.py test_in.wav
          ./laermtracker.exe --wav-in test_in.wav --start "2026-10-03 21:59:30" --out out_pc
          python tests/check_pc.py out_pc
          ./laermtracker.exe --list
      - name: GUI bauen (MinGW, statisch, mit Manifest)
        shell: bash
        run: |
          windres pc/gui.rc -O coff -o gui_rc.o
          gcc -std=gnu99 -O2 -Wall -Wextra -mwindows -static -o laermtracker-gui.exe pc/gui.c core/noise_core.c gui_rc.o -lwinmm -lcomctl32 -lshell32 -lole32 -lgdi32 -luser32 -lm
      - name: GUI-Selbsttest (WAV statt Mikrofon, prueft Thread, Kern und Ereignisliste)
        shell: bash
        run: |
          python tests/make_test_wav.py test_in.wav
          mkdir -p out_gui
          ./laermtracker-gui.exe --selftest test_in.wav --start "2026-10-03 21:59:30" --out "$PWD/out_gui"
          echo "Exitcode $?"
          cat out_gui/selftest_result.txt
          grep -q "^OK" out_gui/selftest_result.txt
          python tests/check_pc.py out_gui
      - uses: actions/upload-artifact@v4
        with:
          name: laermtracker-windows
          path: |
            laermtracker.exe
            laermtracker-gui.exe
